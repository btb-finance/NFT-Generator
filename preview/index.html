<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OPOSSUM NFT — Preview</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #1a1a1d;
    --line: #2a2a2f;
    --text: #e8e8ea;
    --muted: #9b9ba1;
    --accent: #ff1493;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  button {
    padding: 10px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  button:hover { filter: brightness(1.1); }
  button.copy {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 500;
  }
  button.copy:hover { color: var(--text); border-color: var(--text); }
  button.copy.copied { color: #6ee7b7; border-color: #6ee7b7; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .card svg {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .meta { padding: 12px; }
  .name { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .traits {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 10px;
    font-size: 12px;
    line-height: 1.4;
  }
  .traits .k { color: var(--muted); }
  .traits .v { color: var(--text); }
  .actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .seed { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; color: var(--muted); margin-top: 6px; word-break: break-all; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 6px;
  }
  .badge.Mythic    { background: #ff1493; color: white; }
  .badge.Legendary { background: #ffd700; color: #1a1a1d; }
  .badge.Epic      { background: #9b30ff; color: white; }
  .badge.Rare      { background: #1e90ff; color: white; }
  .badge.Common    { background: #555; color: white; }
</style>
</head>
<body>
<header>
  <div>
    <h1>OPOSSUM NFT — Preview</h1>
    <div class="sub">JS port of <code>OposRenderer</code>. Click <b>Mint 20 New</b> to roll fresh randoms. Click <b>Copy JSON</b> to share metadata.</div>
  </div>
  <button onclick="mintTwenty()">Mint 20 New</button>
</header>
<div id="dist-bar" style="background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 12px; color: var(--muted);"></div>
<div id="grid" class="grid"></div>

<script>
// ───────────────────────────────────────────────────────────
// Lookup tables — kept in sync with src/OposNFT.sol + OposRenderer.sol
// ───────────────────────────────────────────────────────────
const BG_COLORS = ["#87CEEB","#FFB6C1","#228B22","#191970","#9B59B6","#FFA500","#FF69B4"];
const BG_NAMES  = ["Sky Blue","Pink Dream","Forest Green","Night Sky","Purple Nebula","Sunset Orange","Hot Pink"];

const BODY_COLORS = [
  "#FF8C42","#2C2C2C","#F5F5F5","#A9A9A9","#D4B896","#87CEEB","#FFD700","#FFB6C1","#C0C0C0","#8B4513",
  "#FF1493","#E6E6FA","#98FF98","#FF7F50","#008080","#FFDAB9","#800020","#000080","#50C878","#B76E79",
  "#DC143C","#40E0D0","#8A2BE2","#808000","#9B30FF","#39FF14","#FF6347","#B9F2FF","#4B0082","#E0B0FF"
];
const BODY_NAMES = [
  "Orange","Black","White","Gray","Siamese","Blue","Golden","Pink","Chrome","Brown",
  "Rainbow","Lavender","Mint","Coral","Teal","Peach","Burgundy","Navy","Emerald","Rose Gold",
  "Crimson","Turquoise","Violet","Olive","Cosmic Purple","Neon Green","Sunset Orange","Diamond","Galaxy","Holographic"
];

const EYE_COLORS = [
  "#00FF00","#0000FF","#FFD700","#FF69B4","#8B4513","#00FFFF","#FF0000","#9370DB","#FFBF00","#EE82EE",
  "#40E0D0","#C0C0C0","#00FF00","#4B0082","#FFA500","#0F52BA","#50C878","#FF1493","#FF0033","#1E90FF"
];
const EYE_NAMES = [
  "Green","Blue","Gold","Pink","Brown","Cyan","Red","Purple","Amber","Violet",
  "Turquoise","Silver","Lime","Indigo","Orange","Sapphire","Emerald","Rainbow","Laser Red","Cosmic Blue"
];

const EXPRESSIONS = ["Happy","Sleepy","Winking","Surprised","Grumpy","Loving","Excited","Shy","Curious","Normal"];
const PATTERNS    = ["None","Striped","Spotted","Tuxedo","Patches","Tiger Stripes","Gradient","Calico","Galaxy Swirl","Flames"];
const ACCESSORIES = ["None","Crown","Top Hat","Bow Tie","Sunglasses","Bandana","Astronaut Helmet","Pirate Eye Patch","Golden Crown","Wizard Hat","Flower Crown","Monocle","Cape","Halo","Headphones"];

// Fixed darker accent used for stripes/spots/patches (matches Solidity _adjustBrightness).
const SHADE = "#5C4033";

// ───────────────────────────────────────────────────────────
// Trait extraction from a 256-bit seed (matches Solidity bit ranges)
// ───────────────────────────────────────────────────────────
function bits(seed, shift, mod) {
  return Number((seed >> BigInt(shift)) % BigInt(mod));
}
function traits(seed) {
  const bodyIdx      = bits(seed, 0, 30);
  const expressionIdx= bits(seed, 8, 10);
  const patternIdx   = bits(seed, 16, 10);
  const accessoryIdx = bits(seed, 24, 15);
  const eyeIdx       = bits(seed, 32, 20);
  const bgIdx        = bits(seed, 40, 7);
  return { bodyIdx, expressionIdx, patternIdx, accessoryIdx, eyeIdx, bgIdx };
}

// Mirrors OposNFT._getRarityTier
function rarityTier(seed) {
  const t = traits(seed);
  let score = 0;
  // Ultra rare bodies: Rainbow(10), Chrome(8), Rose Gold(19), Diamond/Galaxy/Holographic(>=27)
  if (t.bodyIdx === 10 || t.bodyIdx === 8 || t.bodyIdx === 19 || t.bodyIdx >= 27) score += 3;
  else if (t.bodyIdx === 6 || t.bodyIdx === 16 || t.bodyIdx === 17 || t.bodyIdx === 18 || t.bodyIdx >= 24) score += 2;

  // Legendary accessories
  if (t.accessoryIdx === 8 || t.accessoryIdx === 9 || t.accessoryIdx >= 13) score += 3;
  else if (t.accessoryIdx === 1 || t.accessoryIdx === 2 || t.accessoryIdx === 6 || t.accessoryIdx === 11 || t.accessoryIdx === 12) score += 2;

  if (t.eyeIdx === 2 || t.eyeIdx === 11 || t.eyeIdx === 13 || t.eyeIdx >= 17) score += 1;
  if (t.patternIdx === 7 || t.patternIdx === 5 || t.patternIdx >= 8) score += 1;

  if (score >= 6) return "Mythic";
  if (score >= 4) return "Legendary";
  if (score >= 3) return "Epic";
  if (score >= 1) return "Rare";
  return "Common";
}
function generation(tokenId) {
  if (tokenId <= 17777) return "Genesis";
  if (tokenId <= 35555) return "Alpha";
  if (tokenId <= 53332) return "Beta";
  if (tokenId <= 71110) return "Gamma";
  return "Delta";
}

// ───────────────────────────────────────────────────────────
// SVG rendering — port of OposRenderer._drawOpossum
// ───────────────────────────────────────────────────────────
function pixel(x, y, color) {
  return `<rect x="${x*20}" y="${y*20}" width="20" height="20" fill="${color}"/>`;
}
function rect(x, y, w, h, color) {
  return `<rect x="${x*20}" y="${y*20}" width="${w*20}" height="${h*20}" fill="${color}"/>`;
}

function drawEyes(expression, eyeColor) {
  if (expression === 0) return rect(9,7,2,1,"#000")+rect(13,7,2,1,"#000")+pixel(9,6,"#000")+pixel(14,6,"#000");
  if (expression === 1) return rect(9,8,2,1,"#000")+rect(13,8,2,1,"#000");
  if (expression === 2) return rect(9,7,2,2,eyeColor)+pixel(9,7,"#FFFFFF")+rect(13,8,2,1,"#000");
  if (expression === 3) return rect(9,7,2,2,"#000")+rect(13,7,2,2,"#000")+pixel(9,7,"#FFFFFF")+pixel(13,7,"#FFFFFF");
  if (expression === 4) return rect(9,8,2,1,"#000")+rect(13,8,2,1,"#000")+pixel(8,6,"#000")+pixel(10,7,"#000")+pixel(13,7,"#000")+pixel(15,6,"#000");
  if (expression === 5) return pixel(9,7,"#FF1493")+pixel(10,7,"#FF1493")+pixel(13,7,"#FF1493")+pixel(14,7,"#FF1493")+pixel(9,8,"#FF1493")+pixel(13,8,"#FF1493");
  if (expression === 6) return rect(9,7,2,2,eyeColor)+rect(13,7,2,2,eyeColor)+pixel(9,7,"#FFFFFF")+pixel(13,7,"#FFFFFF");
  if (expression === 7) return rect(9,8,2,1,eyeColor)+rect(13,8,2,1,eyeColor);
  if (expression === 8) return rect(9,7,2,1,"#000")+rect(13,7,2,1,"#000")+pixel(8,6,"#000")+pixel(9,6,"#000");
  return pixel(9,7,"#000")+pixel(10,7,"#000")+pixel(13,7,"#000")+pixel(14,7,"#000");
}

function drawPattern(pattern) {
  if (pattern === 1) return rect(7,14,1,5,SHADE)+rect(10,14,1,5,SHADE)+rect(13,14,1,5,SHADE)+rect(16,14,1,5,SHADE);
  if (pattern === 2) return pixel(8,15,SHADE)+pixel(15,16,SHADE)+pixel(11,17,SHADE)+pixel(13,14,SHADE);
  if (pattern === 3) return rect(11,14,2,5,"#FFFFFF");
  if (pattern === 4) return rect(7,14,3,2,SHADE)+rect(14,16,3,2,SHADE);
  if (pattern === 5) return rect(8,15,3,1,"#000")+rect(13,17,3,1,"#000");
  if (pattern === 6) return rect(6,18,12,1,SHADE);
  if (pattern === 7) return rect(7,14,3,2,"#FF8C42")+rect(14,16,3,2,"#2C2C2C")+rect(10,18,3,1,"#FFFFFF");
  if (pattern === 8) return pixel(8,14,"#9B30FF")+pixel(11,15,"#FFFFFF")+pixel(14,14,"#4B0082")+pixel(16,17,"#9B30FF")+pixel(9,18,"#FFFFFF")+pixel(13,16,"#4B0082");
  if (pattern === 9) return rect(7,19,1,1,"#FF6347")+rect(9,18,1,2,"#FF4500")+rect(11,19,2,1,"#FFA500")+rect(14,18,1,2,"#FF4500")+rect(16,19,1,1,"#FF6347");
  return "";
}

function drawAccessory(accessory, eyeColor) {
  if (accessory === 1) return rect(9,2,6,2,"#FFD700")+pixel(10,1,"#FFD700")+pixel(12,1,"#FFD700")+pixel(14,1,"#FFD700");
  if (accessory === 2) return rect(9,0,6,2,"#000")+rect(8,2,8,1,"#000");
  if (accessory === 3) return rect(10,13,1,1,"#FF0000")+rect(13,13,1,1,"#FF0000")+pixel(11,13,"#FF0000")+pixel(12,13,"#FF0000");
  if (accessory === 4) return rect(8,7,3,2,"#000")+rect(13,7,3,2,"#000")+rect(11,7,2,1,"#000");
  if (accessory === 5) return rect(7,4,10,1,"#FF0000")+pixel(6,5,"#FF0000")+pixel(17,5,"#FF0000");
  if (accessory === 6) return rect(6,3,12,1,"#C0C0C0")+rect(5,4,1,9,"#C0C0C0")+rect(18,4,1,9,"#C0C0C0")+pixel(7,4,"#FFFFFF")+pixel(6,5,"#FFFFFF");
  if (accessory === 7) return rect(13,7,3,2,"#000")+rect(7,6,10,1,"#000");
  if (accessory === 8) return rect(8,1,8,3,"#FFD700")+pixel(9,0,"#FFD700")+pixel(11,0,"#FFD700")+pixel(13,0,"#FFD700")+pixel(15,0,"#FFD700");
  if (accessory === 9) return rect(11,0,2,3,"#4B0082")+rect(10,3,4,1,"#4B0082")+pixel(12,2,"#FFD700");
  if (accessory === 10) return pixel(8,3,"#FF69B4")+pixel(10,3,"#FFD700")+pixel(12,3,"#FF1493")+pixel(14,3,"#FF69B4")+pixel(16,3,"#FFD700");
  if (accessory === 11) return rect(13,7,2,2,"#C0C0C0")+pixel(14,8,eyeColor);
  if (accessory === 12) return rect(3,13,2,7,"#B22222")+rect(19,13,2,7,"#B22222")+rect(7,12,10,1,"#B22222");
  if (accessory === 13) return rect(9,1,6,1,"#FFD700")+pixel(8,1,"#FFD700")+pixel(15,1,"#FFD700");
  if (accessory === 14) return rect(7,3,10,1,"#000")+rect(6,3,1,4,"#000")+rect(17,3,1,4,"#000")+pixel(6,4,"#FF1493")+pixel(17,4,"#FF1493");
  return "";
}

function drawOpossum(seed) {
  const t = traits(seed);
  const bodyColor = BODY_COLORS[t.bodyIdx];
  const eyeColor = EYE_COLORS[t.eyeIdx];
  const accessoryVisual = Number((seed >> 24n) % 15n);

  let out = "";
  // Ears
  out += pixel(7,2,"#000")+pixel(8,2,"#000")+pixel(7,3,"#000")+pixel(8,3,"#FFC0CB")+pixel(7,4,"#000")+pixel(8,4,"#FFC0CB");
  out += pixel(15,2,"#000")+pixel(16,2,"#000")+pixel(15,3,"#FFC0CB")+pixel(16,3,"#000")+pixel(15,4,"#FFC0CB")+pixel(16,4,"#000");
  // Head outline
  out += rect(6,4,12,1,"#000")+rect(6,4,1,5,"#000")+rect(17,4,1,5,"#000");
  out += pixel(7,9,"#000")+pixel(16,9,"#000")+pixel(8,10,"#000")+pixel(15,10,"#000");
  out += pixel(9,11,"#000")+pixel(14,11,"#000")+pixel(10,12,"#000")+pixel(13,12,"#000");
  // Head fill
  out += rect(7,4,10,5,bodyColor)+rect(8,9,8,1,bodyColor)+rect(9,10,6,1,bodyColor)+rect(10,11,4,1,bodyColor);
  // White face mask
  out += rect(8,6,8,3,"#FFFFFF")+rect(9,9,6,1,"#FFFFFF")+rect(10,10,4,1,"#FFFFFF")+rect(11,11,2,1,"#FFFFFF");
  // Pink nose
  out += pixel(11,12,"#FF1493")+pixel(12,12,"#FF1493");
  // Eyes
  out += drawEyes(t.expressionIdx, eyeColor);
  // Shoulders bridging
  out += rect(7,12,3,1,bodyColor)+rect(13,12,4,1,bodyColor)+pixel(7,12,"#000")+pixel(16,12,"#000");
  // Body outline + fill
  out += rect(5,13,14,1,"#000")+rect(5,19,14,1,"#000")+rect(5,13,1,7,"#000")+rect(18,13,1,7,"#000")+rect(6,14,12,5,bodyColor);
  // Belly
  out += rect(8,15,8,3,"#F5F5F5");
  // Pink toes
  out += rect(6,19,2,1,"#FFC0CB")+rect(10,19,2,1,"#FFC0CB")+rect(14,19,2,1,"#FFC0CB")+rect(16,19,2,1,"#FFC0CB");
  // Tail
  out += pixel(19,16,"#000")+pixel(19,17,bodyColor)+pixel(19,18,"#000");
  out += pixel(20,15,"#000")+pixel(20,16,bodyColor);
  out += pixel(21,14,"#000")+pixel(21,15,bodyColor);
  out += pixel(22,13,"#000")+pixel(22,14,"#FFC0CB")+pixel(22,15,"#000");
  // Pattern + accessory overlays
  out += drawPattern(t.patternIdx);
  out += drawAccessory(accessoryVisual, eyeColor);
  return out;
}

function buildSVG(seed) {
  const t = traits(seed);
  return `<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">`
    + `<rect width="480" height="480" fill="${BG_COLORS[t.bgIdx]}"/>`
    + drawOpossum(seed)
    + `</svg>`;
}

// ───────────────────────────────────────────────────────────
// Card rendering + minting
// ───────────────────────────────────────────────────────────
function metadataObject(tokenId, seed) {
  const t = traits(seed);
  const rarity = rarityTier(seed);
  return {
    name: `OPOSSUM ${rarity} #${tokenId}`,
    description: "88,888 fully on-chain OPOSSUM NFTs. Every holder earns a 1/88,888 share of every OPOS transfer tax in real time, claimable on demand.",
    seed: "0x" + seed.toString(16).padStart(64, "0"),
    attributes: [
      { trait_type: "Rarity",     value: rarity },
      { trait_type: "Generation", value: generation(tokenId) },
      { trait_type: "Body",       value: BODY_NAMES[t.bodyIdx] },
      { trait_type: "Eyes",       value: EYE_NAMES[t.eyeIdx] },
      { trait_type: "Expression", value: EXPRESSIONS[t.expressionIdx] },
      { trait_type: "Pattern",    value: PATTERNS[t.patternIdx] },
      { trait_type: "Accessory",  value: ACCESSORIES[t.accessoryIdx] },
      { trait_type: "Background", value: BG_NAMES[t.bgIdx] },
      { trait_type: "Status",     value: "Active" },
      { trait_type: "Claimable OPOS", value: formatAmount(0) },
      { trait_type: "Lifetime OPOS",  value: formatAmount(0) }
    ]
  };
}

function formatAmount(n) {
  // Format a whole-token amount with K/M/B suffix (one decimal, trim ".0")
  if (n >= 1_000_000_000) return decimalPart(n, 1_000_000_000) + "B";
  if (n >= 1_000_000)     return decimalPart(n, 1_000_000)     + "M";
  if (n >= 1_000)         return decimalPart(n, 1_000)         + "K";
  return String(n);
}
function decimalPart(n, unit) {
  const integerPart = Math.floor(n / unit);
  const oneDecimal = Math.floor((n % unit) / (unit / 10));
  if (oneDecimal === 0) return String(integerPart);
  return integerPart + "." + oneDecimal;
}

function makeCard(tokenId, seed) {
  const meta = metadataObject(tokenId, seed);
  const traitRows = meta.attributes
    .filter(a => a.trait_type !== "Claimable OPOS" && a.trait_type !== "Lifetime OPOS")
    .map(a => `<div class="k">${a.trait_type}</div><div class="v">${a.value}</div>`)
    .join("");
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    ${buildSVG(seed)}
    <div class="meta">
      <div class="name">#${tokenId}<span class="badge ${meta.attributes[0].value}">${meta.attributes[0].value}</span></div>
      <div class="traits">${traitRows}</div>
      <div class="seed">${meta.seed}</div>
      <div class="actions">
        <button class="copy" data-meta='${escapeAttr(JSON.stringify(meta))}'>Copy JSON</button>
      </div>
    </div>
  `;
  return div;
}

function escapeAttr(s) { return s.replace(/'/g, "&apos;").replace(/"/g, "&quot;"); }

document.addEventListener("click", (e) => {
  const btn = e.target.closest("button.copy");
  if (!btn) return;
  navigator.clipboard.writeText(btn.dataset.meta).then(() => {
    btn.classList.add("copied");
    btn.textContent = "Copied!";
    setTimeout(() => { btn.classList.remove("copied"); btn.textContent = "Copy JSON"; }, 1200);
  });
});

function randomSeed() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  let s = 0n;
  for (const b of arr) s = (s << 8n) | BigInt(b);
  return s;
}

function tierIndex(seed) {
  const r = rarityTier(seed);
  return ["Mythic","Legendary","Epic","Rare","Common"].indexOf(r);
}

// Tier name → percent of fees that tier earns (always 20%) and what each NFT
// in this batch would earn relative to a Common, given just these 20 mints.
function distributionSummary(seedsList) {
  const counts = [0,0,0,0,0];
  for (const s of seedsList) counts[tierIndex(s)]++;
  const tierNames = ["Mythic","Legendary","Epic","Rare","Common"];
  const parts = tierNames.map((n, i) => {
    const c = counts[i];
    const perNft = c > 0 ? `20% / ${c} = ${(20/c).toFixed(2)}%` : `20% (banked — no NFT yet)`;
    return `<b style="color:var(--text)">${n}</b> ${c} NFT${c===1?"":"s"} → ${perNft} each`;
  });
  return "Per fee, each tier earns 20%. From this 20-mint sample: " + parts.join(" · ");
}

function mintTwenty() {
  const grid = document.getElementById("grid");
  const bar = document.getElementById("dist-bar");
  grid.innerHTML = "";
  const seeds = [];
  for (let i = 0; i < 20; i++) seeds.push(randomSeed());
  for (let i = 0; i < 20; i++) grid.appendChild(makeCard(i + 1, seeds[i]));
  bar.innerHTML = distributionSummary(seeds);
}

mintTwenty();
</script>
</body>
</html>
